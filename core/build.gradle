[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  implementation "org.reflections:reflections:0.10.2"
  implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  implementation "com.badlogicgames.box2dlights:box2dlights:1.5"
  implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
  implementation "com.crashinvaders.vfx:gdx-vfx-core:0.5.4"
  implementation "com.crashinvaders.vfx:gdx-vfx-effects:0.5.4" // optional but useful (BloomEffect, etc.)
  implementation "com.badlogicgames.gdx-video:gdx-video:1.3.3"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
